[project]
name = "athena-research-assistant"
version = "0.1.0"
description = "Multi-agent research copilot with deterministic citation verification"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "2u39u4", email = "junyezhao9@gmail.com" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
